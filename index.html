<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чисельні методи · Лабораторні роботи</title>
<style>
  :root {
    --bg: #11151c; --card: #1a2029; --ink: #e9edf3; --muted: #9aa5b4; --line: #2b3442; --accent: #ffb26b;
    --ctrl: #232c38; --ctrl-line: #3a4556; --active: #2a3546;
  }
  :root[data-theme="light"] {
    --bg: #f7f5ef; --card: #fffdf8; --ink: #1b2330; --muted: #5a6272; --line: #e2ddd0; --accent: #b4501f;
    --ctrl: #ffffff; --ctrl-line: #cfc9ba; --active: #f0ece2;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "Segoe UI", system-ui, Arial, sans-serif;
    display: grid; grid-template-columns: 230px minmax(0, 1fr); }
  nav { background: var(--card); border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
  nav .brand { font-weight: 700; font-size: 18px; padding: 0 8px 2px; }
  nav .sub { color: var(--muted); font-size: 13px; padding: 0 8px 12px; }
  nav a { display: flex; gap: 10px; align-items: baseline; padding: 7px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; }
  nav a .n { color: var(--muted); font-family: Consolas, "Courier New", monospace; }
  nav a:hover { background: var(--active); }
  nav a.on { background: var(--active); box-shadow: inset 3px 0 0 var(--accent); font-weight: 600; }
  nav a.off { color: var(--muted); pointer-events: none; opacity: .55; }
  nav .soon { font-size: 12px; margin-left: auto; }
  nav button { margin-top: auto; font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--ctrl-line); background: var(--ctrl); color: var(--ink); cursor: pointer; }
  iframe { border: 0; width: 100%; height: 100%; display: block; background: var(--bg); }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    nav { flex-direction: row; align-items: center; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; }
    nav .brand { font-size: 16px; white-space: nowrap; padding: 0 8px; }
    nav .sub, nav .soon, nav a.off { display: none; }
    nav a { white-space: nowrap; }
    nav button { margin: 0 0 0 auto; }
  }
</style>
</head>
<body>
<nav id="nav">
  <div class="brand">Чисельні методи</div>
  <div class="sub">Матеріали до лабораторних робіт</div>
</nav>
<iframe id="frame" title="Лабораторна"></iframe>
<script>
// Оболонка: меню лаб; лаба — окрема сторінка в iframe, тема передається в хеші (lab2.html#theme=dark).
// Пряме посилання на лабу: index.html#lab=2
const LABS = [
  { n: 1, title: "Похибки", file: "lab1.html" },
  { n: 2, title: "Лагранж", file: "lab2.html" },
  { n: 3, title: "Похідна й інтеграл", file: "lab3.html" },
  { n: 4, title: "СЛАР", file: "lab4.html" },
  { n: 5, title: "Рівняння" },
  { n: 6, title: "ОДУ" }
];
const ready = LABS.filter(l => l.file);
const store = {
  get(k, d) { try { return localStorage.getItem("chm." + k) || d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("chm." + k, v); } catch (e) {} }
};
let theme = store.get("theme", "dark"), lab = null;
const nav = document.getElementById("nav"), frame = document.getElementById("frame");

LABS.forEach(l => {
  const a = document.createElement("a");
  a.href = l.file ? `#lab=${l.n}` : "#"; a.dataset.n = l.n;
  a.innerHTML = `<span class="n">${l.n}</span><span>${l.title}</span>` + (l.file ? "" : '<span class="soon">скоро</span>');
  if (!l.file) a.className = "off";
  nav.appendChild(a);
});
const btn = document.createElement("button");
btn.textContent = "☀ / ☾"; btn.title = "Світла / темна тема";
nav.appendChild(btn);

function applyTheme() {
  if (theme === "light") document.documentElement.setAttribute("data-theme", "light"); else document.documentElement.removeAttribute("data-theme");
}
// вкладка лаби: m — матеріал, q — питання; null — як задано на сторінці лаби
let tab = null;
const frameUrl = () => `${lab.file}#theme=${theme}` + (tab ? `&tab=${tab}` : "");
function show() {
  const P = new URLSearchParams(location.hash.slice(1)), want = Number(P.get("lab"));
  tab = P.get("tab") === "q" || P.get("tab") === "m" ? P.get("tab") : null;
  const l = ready.find(x => x.n === want) || ready.find(x => x.n === Number(store.get("lab", ""))) || ready[ready.length - 1];
  if (l.n !== want) { history.replaceState(null, "", `#lab=${l.n}`); }
  lab = l; store.set("lab", String(l.n));
  nav.querySelectorAll("a").forEach(a => a.classList.toggle("on", Number(a.dataset.n) === l.n));
  frame.src = frameUrl();
  document.title = `ЛР${l.n} · ${l.title} — Чисельні методи`;
}
btn.addEventListener("click", () => {
  theme = theme === "dark" ? "light" : "dark"; store.set("theme", theme); applyTheme();
  frame.src = frameUrl();
});
// сторінка лаби повідомляє про зміну вкладки — оновлюємо адресу, щоб посилання вело туди ж
window.addEventListener("message", e => {
  if (!e.data || e.data.type !== "chm-tab") return;
  tab = e.data.tab;
  history.replaceState(null, "", `#lab=${lab.n}` + (tab === "q" ? "&tab=q" : ""));
});
window.addEventListener("hashchange", show);
applyTheme(); show();
</script>
</body>
</html>
